name: Traffic Navigator Browser Worker

on:
  workflow_dispatch:

concurrency:
  group: traffic-navigator-browser-worker
  cancel-in-progress: false

jobs:
  browser-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://bqtoojljhklsyegcbdjq.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install browser worker dependencies
        run: npm install --prefix scripts --no-package-lock --legacy-peer-deps playwright@1.63.0 @supabase/supabase-js@2.76.1

      - name: Install Chromium
        run: ./scripts/node_modules/.bin/playwright install --with-deps chromium

      - name: Run browser worker
        run: node --experimental-strip-types scripts/browser-worker.ts
